# QP2 Data Portal — Apache Configuration
# Add to existing Apache vhost for www.gmca.aps.anl.gov
#
# Prerequisites:
#   1. Enable Apache modules: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
#   2. Build frontend: cd web_app/frontend && VITE_BASE_PATH=/data_portal/ VITE_API_URL=/data_portal/api npm run build
#   3. Start backend: systemctl start qp2-web-backend
#   4. Restart Apache: systemctl restart apache2
#
# Backend runs on 127.0.0.1:8000 (systemd service)

# Alias for the frontend static files
Alias /data_portal /mnt/beegfs/qxu/data-analysis/qp2/web_app/frontend/dist

<Directory /mnt/beegfs/qxu/data-analysis/qp2/web_app/frontend/dist>
    Require all granted
    Options -Indexes

    # SPA fallback — serve index.html for all frontend routes
    RewriteEngine On
    RewriteBase /data_portal/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.html [L]
</Directory>

# Proxy API calls to backend
# All API endpoints are proxied under /data_portal/api/
ProxyPreserveHost On

ProxyPass        /data_portal/api/login          http://127.0.0.1:8000/login
ProxyPassReverse /data_portal/api/login          http://127.0.0.1:8000/login

ProxyPass        /data_portal/api/logout         http://127.0.0.1:8000/logout
ProxyPassReverse /data_portal/api/logout         http://127.0.0.1:8000/logout

ProxyPass        /data_portal/api/user/          http://127.0.0.1:8000/user/
ProxyPassReverse /data_portal/api/user/          http://127.0.0.1:8000/user/

ProxyPass        /data_portal/api/spreadsheets/  http://127.0.0.1:8000/spreadsheets/
ProxyPassReverse /data_portal/api/spreadsheets/  http://127.0.0.1:8000/spreadsheets/

ProxyPass        /data_portal/api/upload         http://127.0.0.1:8000/upload
ProxyPassReverse /data_portal/api/upload         http://127.0.0.1:8000/upload

ProxyPass        /data_portal/api/export         http://127.0.0.1:8000/export
ProxyPassReverse /data_portal/api/export         http://127.0.0.1:8000/export

ProxyPass        /data_portal/api/send_to_http   http://127.0.0.1:8000/send_to_http
ProxyPassReverse /data_portal/api/send_to_http   http://127.0.0.1:8000/send_to_http

ProxyPass        /data_portal/api/datasets/      http://127.0.0.1:8000/datasets/
ProxyPassReverse /data_portal/api/datasets/      http://127.0.0.1:8000/datasets/

ProxyPass        /data_portal/api/processing/    http://127.0.0.1:8000/processing/
ProxyPassReverse /data_portal/api/processing/    http://127.0.0.1:8000/processing/

ProxyPass        /data_portal/api/scheduler/     http://127.0.0.1:8000/scheduler/
ProxyPassReverse /data_portal/api/scheduler/     http://127.0.0.1:8000/scheduler/

ProxyPass        /data_portal/api/h5grove/       http://127.0.0.1:8000/h5grove/
ProxyPassReverse /data_portal/api/h5grove/       http://127.0.0.1:8000/h5grove/

ProxyPass        /data_portal/api/viewer/        http://127.0.0.1:8000/viewer/
ProxyPassReverse /data_portal/api/viewer/        http://127.0.0.1:8000/viewer/

# Chat SSE — needs longer timeouts and no buffering
ProxyPass        /data_portal/api/chat/          http://127.0.0.1:8000/chat/
ProxyPassReverse /data_portal/api/chat/          http://127.0.0.1:8000/chat/
<Location /data_portal/api/chat/stream>
    ProxyPass        http://127.0.0.1:8000/chat/stream
    ProxyPassReverse http://127.0.0.1:8000/chat/stream
    SetEnv proxy-sendchunked 1
    SetEnv proxy-initial-not-pooled 1
</Location>

# Security headers
<Location /data_portal>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'"
</Location>
